name: Build TWRP for Pixel 5 (Bramble)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk

    - name: Clean up APT cache & unused tools
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
        df -h
    
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-11-openjdk-amd64/bin" >> $GITHUB_PATH

    - name: Install repo launcher
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+rx ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source
      run: |
        mkdir -p ~/android/twrp
        cd ~/android/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync --force-sync --current-branch --no-tags --optimized-fetch --prune -j2

    - name: Clone Device Tree
      run: |
        cd ~/android/twrp/device/google
        git clone https://github.com/JoshuaDoes/twrp_device_google_bramble.git bramble

    - name: Clone Kernel Source
      run: |
        cd ~/android/twrp/kernel/google
        git clone --depth=1 https://github.com/GrapheneOS/kernel_google_redbull.git bramble

    - name: Clone Vendor Blobs
      run: |
        cd ~/android/twrp/vendor/google
        git clone --depth=1 https://github.com/TheMuppets/proprietary_vendor_google.git

    - name: Source Environment & Build Recovery
      run: |
        cd ~/android/twrp
        source build/envsetup.sh
        lunch twrp_bramble-eng
        mka recoveryimage

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: twrp-recovery-bramble
        path: ~/android/twrp/out/target/product/bramble/recovery.img
